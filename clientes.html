<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propigestion - Cartera de Clientes</title>
  
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    /* VARIABLES DE TEMA (SINCRONIZADAS CON MENU.HTML) */
    :root[data-theme="dark"] {
      --bg-main: #0b0f19;
      --bg-card: rgba(18, 26, 43, 0.75);
      --bg-input: rgba(0, 0, 0, 0.3);
      --border-card: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --header-bg: rgba(11, 15, 25, 0.85);
      --sidebar-bg: rgba(11, 15, 25, 0.95);
      --row-hover: rgba(255, 255, 255, 0.04);
      --shadow-color: rgba(0, 0, 0, 0.4);
    }

    :root[data-theme="light"] {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --border-card: #e2e8f0;
      --accent-cyan: #0284c7;
      --accent-blue: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --header-bg: rgba(255, 255, 255, 0.9);
      --sidebar-bg: #ffffff;
      --row-hover: #f8fafc;
      --shadow-color: rgba(0, 0, 0, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ENCABEZADO SUPERIOR */
    header {
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-card);
      padding: 0.8rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 500;
      box-shadow: 0 4px 20px var(--shadow-color);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .hamburger-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hamburger-btn:hover {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #fff;
      border-color: transparent;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .logo-p {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #0b0f19;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
    }

    .logo-text {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .logo-text span {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .theme-toggle-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    /* SIDEBAR DINÁMICO */
    .sidebar-menu {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100vh;
      background: var(--sidebar-bg);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-card);
      transition: left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-menu.active { left: 0; }

    .sidebar-header {
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-card);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .menu-list {
      list-style: none;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .menu-item-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.2rem;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .menu-item-btn:hover {
      background: var(--row-hover);
      color: var(--text-main);
    }

    .menu-item-btn-content {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .menu-item-btn i.main-icon {
      width: 24px;
      text-align: center;
      color: var(--accent-cyan);
    }

    .arrow-icon {
      transition: transform 0.3s ease;
      font-size: 0.8rem;
    }

    .menu-item.open .arrow-icon { transform: rotate(180deg); }

    .submenu-list {
      list-style: none;
      padding-left: 2.5rem;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .menu-item.open .submenu-list {
      max-height: 500px;
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
    }

    .submenu-item a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem 1.2rem;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .submenu-item a:hover {
      background: var(--row-hover);
      color: var(--text-main);
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 999;
    }

    .sidebar-overlay.active { display: block; }

    /* LAYOUT PRINCIPAL */
    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 1024px) {
      .layout-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px var(--shadow-color);
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .card-title i { color: var(--accent-cyan); }

    /* COUNTER BADGE */
    .counter-badge {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #0b0f19;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    /* BUSCADOR Y LISTA IZQUIERDA */
    .search-box {
      margin-bottom: 1rem;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 0.65rem 1rem 0.65rem 2.4rem;
      color: var(--text-main);
      outline: none;
      font-size: 0.9rem;
    }

    .search-box i {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .client-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 650px;
      overflow-y: auto;
      padding-right: 0.3rem;
    }

    .client-item {
      background: var(--bg-input);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .client-item:hover, .client-item.active {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    .client-info h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }

    .client-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .badge-dni {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-card);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-family: monospace;
    }

    /* FORMULARIOS */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .input-control {
      background: var(--bg-input);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .input-control:focus { border-color: var(--accent-cyan); }

    /* CARGA Y PREVISUALIZACIÓN DE FOTO DNI */
    .file-input-wrapper {
      position: relative;
      border: 2px dashed var(--border-card);
      border-radius: 12px;
      padding: 1.2rem;
      text-align: center;
      background: var(--bg-input);
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .file-input-wrapper:hover { border-color: var(--accent-cyan); }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-preview-img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 8px;
      margin-top: 0.8rem;
      object-fit: contain;
      border: 1px solid var(--border-card);
      display: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #fff;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-secondary {
      background: var(--bg-input);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      padding: 0.8rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 0.8rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-danger:hover { background: #ef4444; color: #fff; }

    /* DETALLE DEL CLIENTE SELECCIONADO */
    .detail-box {
      background: var(--bg-input);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 1.5rem;
      display: none;
    }

    .detail-box.active { display: block; }

    .dni-photo-display {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      border: 1px solid var(--border-card);
      margin-top: 1rem;
    }

    .wsp-link {
      color: #25D366;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 2.5rem;
      margin-bottom: 0.8rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- HEADER SUPERIOR -->
  <header>
    <div class="brand-container">
      <button id="hamburger-btn" class="hamburger-btn">
        <i class="fas fa-bars"></i>
      </button>
      <div class="logo-box">
        <div class="logo-p">P</div>
        <div class="logo-text">Propi<span>gestion</span></div>
      </div>
    </div>

    <button id="theme-toggle" class="theme-toggle-btn">
      <i class="fas fa-moon" id="theme-icon"></i>
      <span id="theme-text">Modo Oscuro</span>
    </button>
  </header>

  <!-- SIDEBAR LATERAL DINÁMICO -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <nav id="sidebar-menu" class="sidebar-menu"></nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container">
    
    <div class="layout-grid">
      
      <!-- LADO IZQUIERDO: LISTADO Y CONTADOR -->
      <aside>
        <div class="card">
          <div class="card-title">
            <div class="card-title-left">
              <i class="fas fa-address-book"></i> Cartera
            </div>
            <span class="counter-badge" id="client-count">0 Clientes</span>
          </div>

          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" class="search-input" placeholder="Buscar por nombre o DNI...">
          </div>

          <div id="client-list" class="client-list"></div>
        </div>
      </aside>

      <!-- LADO DERECHO: FORMULARIO Y DETALLES -->
      <section>
        
        <!-- FORMULARIO DE REGISTRO / EDICIÓN -->
        <div class="card">
          <div class="card-title">
            <div class="card-title-left">
              <i class="fas fa-user-plus" id="form-icon"></i>
              <span id="form-title">Registrar Nuevo Cliente</span>
            </div>
            <button id="btn-cancel-edit" class="btn-secondary" style="display: none; padding: 0.4rem 0.8rem; font-size: 0.8rem;">
              <i class="fas fa-times"></i> Cancelar Edición
            </button>
          </div>

          <form id="client-form">
            <input type="hidden" id="client-id">
            
            <div class="form-grid">
              <div class="input-group">
                <label>Nombre y Apellido *</label>
                <input type="text" id="nombre" class="input-control" placeholder="Ej. Juan Pérez" required>
              </div>

              <div class="input-group">
                <label>Número de WhatsApp *</label>
                <input type="tel" id="wsp" class="input-control" placeholder="Ej. +5491112345678" required>
              </div>
            </div>

            <div class="input-group" style="margin-bottom: 1.2rem;">
              <label>Número de DNI *</label>
              <input type="text" id="dni" class="input-control" placeholder="Ej. 38456789" required>
            </div>

            <!-- FOTO DNI (OPCIONAL) -->
            <div class="input-group" style="margin-bottom: 1.5rem;">
              <label>Foto de DNI (Opcional - Se puede adjuntar/modificar luego)</label>
              <div class="file-input-wrapper">
                <i class="fas fa-id-card" style="font-size: 2rem; color: var(--accent-cyan); margin-bottom: 0.5rem;"></i>
                <p style="font-size: 0.85rem; color: var(--text-muted);" id="file-label-text">
                  Haz clic o arrastra aquí la imagen del DNI
                </p>
                <input type="file" id="foto-dni" accept="image/*">
                <img id="file-preview" class="file-preview-img" alt="Previsualización DNI">
              </div>
            </div>

            <button type="submit" class="btn-primary" id="btn-submit">
              <i class="fas fa-save"></i> Guardar Cliente
            </button>
          </form>
        </div>

        <!-- DETALLE / FICHA TÉCNICA DEL CLIENTE SELECCIONADO -->
        <div class="card">
          <div class="card-title">
            <div class="card-title-left">
              <i class="fas fa-id-card-clip"></i> Ficha del Cliente
            </div>
          </div>

          <div id="detail-empty" class="empty-state">
            <i class="fas fa-user-circle"></i>
            <p>Selecciona un cliente de la lista izquierda para ver sus detalles completos.</p>
          </div>

          <div id="client-detail" class="detail-box">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
              <div>
                <h3 id="detail-nombre" style="font-size: 1.4rem; font-family: 'Outfit', sans-serif;">---</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.2rem;">
                  DNI: <span id="detail-dni" class="badge-dni">---</span>
                </p>
              </div>
              <div style="display: flex; gap: 0.5rem;">
                <button id="btn-edit-selected" class="btn-secondary" style="padding: 0.5rem 0.9rem; font-size: 0.85rem;">
                  <i class="fas fa-pen"></i> Editar
                </button>
                <button id="btn-delete-selected" class="btn-danger" style="padding: 0.5rem 0.9rem; font-size: 0.85rem;">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>

            <div style="margin-bottom: 1.2rem;">
              <p style="font-size: 0.85rem; color: var(--text-muted);">Contacto Directo:</p>
              <a id="detail-wsp-link" href="#" target="_blank" class="wsp-link">
                <i class="fab fa-whatsapp" style="font-size: 1.2rem;"></i> <span id="detail-wsp">---</span>
              </a>
            </div>

            <div>
              <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">Documento Adjunto (DNI):</p>
              <div id="dni-photo-container"></div>
            </div>
          </div>
        </div>

      </section>
    </div>
  </main>

  <script>
    /* VARIABLES Y ESTADO */
    let clients = JSON.parse(localStorage.getItem("propigestion_clientes")) || [];
    let selectedClientId = null;
    let currentBase64Image = null;

    /* MENÚS POR DEFECTO EN CASO DE NO HABER SIDO CREADOS EN MENU.HTML */
    const defaultMenuItems = [
      { id: 1, nombre: "Dashboard", url: "index.html", icono: "fas fa-chart-line", subpaginas: [] },
      { id: 2, nombre: "Cartera de Clientes", url: "clientes.html", icono: "fas fa-users", subpaginas: [] },
      { id: 3, nombre: "Préstamos", url: "prestamos.html", icono: "fas fa-hand-holding-usd", subpaginas: [] },
      { id: 4, nombre: "Configuración Menú", url: "menu.html", icono: "fas fa-bars-staggered", subpaginas: [] }
    ];

    /* CONFIGURACIÓN DEL TEMA (SINCRONIZADO) */
    function initTheme() {
      const currentTheme = localStorage.getItem("propigestion_theme") || "dark";
      document.documentElement.setAttribute("data-theme", currentTheme);
      updateThemeUI(currentTheme);
    }

    function updateThemeUI(theme) {
      const icon = document.getElementById("theme-icon");
      const text = document.getElementById("theme-text");
      if (theme === "light") {
        icon.className = "fas fa-sun";
        text.innerText = "Modo Claro";
      } else {
        icon.className = "fas fa-moon";
        text.innerText = "Modo Oscuro";
      }
    }

    document.getElementById("theme-toggle").addEventListener("click", () => {
      const activeTheme = document.documentElement.getAttribute("data-theme");
      const newTheme = activeTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", newTheme);
      localStorage.setItem("propigestion_theme", newTheme);
      updateThemeUI(newTheme);
    });

    /* RENDER DE SIDEBAR CON SOPORTE ACORDEÓN */
    function renderSidebarMenu() {
      const sidebar = document.getElementById("sidebar-menu");
      const storedMenu = localStorage.getItem("propigestion_menu");
      const items = storedMenu ? JSON.parse(storedMenu) : defaultMenuItems;

      let html = `
        <div class="sidebar-header">
          <div class="logo-box">
            <div class="logo-p">P</div>
            <div class="logo-text">Propi<span>gestion</span></div>
          </div>
          <button id="close-btn" class="close-btn">&times;</button>
        </div>
        <ul class="menu-list">
      `;

      items.forEach(item => {
        const hasSub = item.subpaginas && item.subpaginas.length > 0;
        if (hasSub) {
          html += `
            <li class="menu-item" id="menu-item-${item.id}">
              <button class="menu-item-btn" onclick="toggleAcordeon(${item.id})">
                <div class="menu-item-btn-content">
                  <i class="${item.icono} main-icon"></i>
                  <span>${item.nombre}</span>
                </div>
                <i class="fas fa-chevron-down arrow-icon"></i>
              </button>
              <ul class="submenu-list">
                ${item.subpaginas.map(sub => `
                  <li class="submenu-item">
                    <a href="${sub.url}">
                      <i class="${sub.icono}"></i>
                      <span>${sub.nombre}</span>
                    </a>
                  </li>
                `).join('')}
              </ul>
            </li>
          `;
        } else {
          html += `
            <li class="menu-item">
              <a href="${item.url}" class="menu-item-btn">
                <div class="menu-item-btn-content">
                  <i class="${item.icono} main-icon"></i>
                  <span>${item.nombre}</span>
                </div>
              </a>
            </li>
          `;
        }
      });

      html += `</ul>`;
      sidebar.innerHTML = html;

      const hamburgerBtn = document.getElementById("hamburger-btn");
      const closeBtn = document.getElementById("close-btn");
      const overlay = document.getElementById("sidebar-overlay");

      function toggleMenu() {
        sidebar.classList.toggle("active");
        overlay.classList.toggle("active");
      }

      if (hamburgerBtn) hamburgerBtn.onclick = toggleMenu;
      if (closeBtn) closeBtn.onclick = toggleMenu;
      if (overlay) overlay.onclick = toggleMenu;
    }

    function toggleAcordeon(id) {
      const menuItem = document.getElementById(`menu-item-${id}`);
      if (menuItem) menuItem.classList.toggle("open");
    }

    /* SISTEMA DE PROCESAMIENTO DE CLIENTES */
    function saveClients() {
      localStorage.setItem("propigestion_clientes", JSON.stringify(clients));
      renderClientList();
      updateCounter();
    }

    function updateCounter() {
      document.getElementById("client-count").innerText = `${clients.length} Clientes`;
    }

    function renderClientList(filter = "") {
      const listContainer = document.getElementById("client-list");
      listContainer.innerHTML = "";

      const filtered = clients.filter(c => 
        c.nombre.toLowerCase().includes(filter.toLowerCase()) || 
        c.dni.includes(filter)
      );

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-users-slash"></i>
            <p>No se encontraron clientes.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(client => {
        const item = document.createElement("div");
        item.className = `client-item ${selectedClientId === client.id ? 'active' : ''}`;
        item.onclick = () => selectClient(client.id);

        item.innerHTML = `
          <div class="client-info">
            <h4>${client.nombre}</h4>
            <p><i class="fab fa-whatsapp" style="color:#25D366;"></i> ${client.wsp}</p>
          </div>
          <div>
            <span class="badge-dni">DNI: ${client.dni}</span>
          </div>
        `;

        listContainer.appendChild(item);
      });
    }

    /* MANEJO DE FOTO DNI (CONVERSIÓN BASE64) */
    document.getElementById("foto-dni").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          currentBase64Image = evt.target.result;
          showImagePreview(currentBase64Image);
        };
        reader.readAsDataURL(file);
      }
    });

    function showImagePreview(src) {
      const img = document.getElementById("file-preview");
      const labelText = document.getElementById("file-label-text");
      img.src = src;
      img.style.display = "block";
      labelText.innerText = "Imagen cargada. Haz clic si deseas reemplazarla.";
    }

    function resetImagePreview() {
      const img = document.getElementById("file-preview");
      const labelText = document.getElementById("file-label-text");
      img.src = "";
      img.style.display = "none";
      labelText.innerText = "Haz clic o arrastra aquí la imagen del DNI";
      currentBase64Image = null;
      document.getElementById("foto-dni").value = "";
    }

    /* GUARDAR / EDITAR CLIENTE */
    document.getElementById("client-form").addEventListener("submit", (e) => {
      e.preventDefault();

      const editId = document.getElementById("client-id").value;
      const nombre = document.getElementById("nombre").value;
      const wsp = document.getElementById("wsp").value;
      const dni = document.getElementById("dni").value;

      if (editId) {
        // Modo Edición
        clients = clients.map(c => {
          if (c.id == editId) {
            return {
              ...c,
              nombre,
              wsp,
              dni,
              fotoDni: currentBase64Image || c.fotoDni
            };
          }
          return c;
        });
      } else {
        // Nuevo Cliente
        const newClient = {
          id: Date.now(),
          nombre,
          wsp,
          dni,
          fotoDni: currentBase64Image || null
        };
        clients.unshift(newClient);
        selectedClientId = newClient.id;
      }

      saveClients();
      resetForm();
      if (selectedClientId) selectClient(selectedClientId);
    });

    /* SELECCIONAR CLIENTE PARA VER FICHA */
    function selectClient(id) {
      selectedClientId = id;
      const client = clients.find(c => c.id === id);

      renderClientList(document.getElementById("search-input").value);

      if (!client) {
        document.getElementById("detail-empty").style.display = "block";
        document.getElementById("client-detail").classList.remove("active");
        return;
      }

      document.getElementById("detail-empty").style.display = "none";
      document.getElementById("client-detail").classList.add("active");

      document.getElementById("detail-nombre").innerText = client.nombre;
      document.getElementById("detail-dni").innerText = client.dni;
      document.getElementById("detail-wsp").innerText = client.wsp;
      
      // Limpiar formato del teléfono para URL de WhatsApp
      const cleanWsp = client.wsp.replace(/[^0-9]/g, '');
      document.getElementById("detail-wsp-link").href = `https://wa.me/${cleanWsp}`;

      const photoContainer = document.getElementById("dni-photo-container");
      if (client.fotoDni) {
        photoContainer.innerHTML = `<img src="${client.fotoDni}" class="dni-photo-display" alt="DNI de ${client.nombre}">`;
      } else {
        photoContainer.innerHTML = `
          <div style="background: var(--bg-card); border: 1px dashed var(--border-card); padding: 1.5rem; text-align: center; border-radius: 10px; color: var(--text-muted); font-size: 0.85rem;">
            <i class="fas fa-image" style="font-size: 1.5rem; margin-bottom: 0.4rem;"></i><br>
            No se ha subido foto del DNI aún. Puedes agregarla haciendo clic en "Editar".
          </div>
        `;
      }
    }

    /* EDITAR DESDE LA FICHA */
    document.getElementById("btn-edit-selected").addEventListener("click", () => {
      if (!selectedClientId) return;
      const client = clients.find(c => c.id === selectedClientId);
      if (!client) return;

      document.getElementById("client-id").value = client.id;
      document.getElementById("nombre").value = client.nombre;
      document.getElementById("wsp").value = client.wsp;
      document.getElementById("dni").value = client.dni;

      document.getElementById("form-title").innerText = "Editar Cliente";
      document.getElementById("form-icon").className = "fas fa-user-pen";
      document.getElementById("btn-submit").innerHTML = `<i class="fas fa-sync-alt"></i> Actualizar Cliente`;
      document.getElementById("btn-cancel-edit").style.display = "inline-block";

      if (client.fotoDni) {
        currentBase64Image = client.fotoDni;
        showImagePreview(client.fotoDni);
      } else {
        resetImagePreview();
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    /* BORRAR CLIENTE SELECCIONADO */
    document.getElementById("btn-delete-selected").addEventListener("click", () => {
      if (!selectedClientId) return;
      if (confirm("¿Estás seguro de que deseas eliminar este cliente?")) {
        clients = clients.filter(c => c.id !== selectedClientId);
        selectedClientId = null;
        saveClients();
        selectClient(null);
      }
    });

    /* CANCELAR EDICIÓN */
    document.getElementById("btn-cancel-edit").addEventListener("click", resetForm);

    function resetForm() {
      document.getElementById("client-form").reset();
      document.getElementById("client-id").value = "";
      document.getElementById("form-title").innerText = "Registrar Nuevo Cliente";
      document.getElementById("form-icon").className = "fas fa-user-plus";
      document.getElementById("btn-submit").innerHTML = `<i class="fas fa-save"></i> Guardar Cliente`;
      document.getElementById("btn-cancel-edit").style.display = "none";
      resetImagePreview();
    }

    /* FILTRO DE BÚSQUEDA */
    document.getElementById("search-input").addEventListener("input", (e) => {
      renderClientList(e.target.value);
    });

    /* INICIALIZACIÓN GENERAL */
    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      renderSidebarMenu();
      renderClientList();
      updateCounter();
    });
  </script>
</body>
</html>
